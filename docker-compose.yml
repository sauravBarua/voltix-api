x-app: &app
  image: voltix-api:local
  build:
    context: .
    target: runtime
  env_file: .env # secrets and settings; the hostnames below override the localhost URLs it holds
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://voltix:voltix@postgres:5432/voltix
    REDIS_URL: redis://redis:6379
    RABBITMQ_URL: amqp://voltix:voltix@rabbitmq:5672
  init: true # a real PID 1 that forwards SIGTERM, so Nest's shutdown hooks run
  restart: unless-stopped
  stop_grace_period: 30s # lets a job or a message in flight finish
  profiles: [app]

services:
  postgres:
    image: postgres:17-alpine
    container_name: voltix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltix
      POSTGRES_PASSWORD: voltix
      POSTGRES_DB: voltix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltix -d voltix']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: voltix-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: voltix
      RABBITMQ_DEFAULT_PASS: voltix
    ports:
      - '5672:5672'
      - '15672:15672' # management UI: http://localhost:15672 (voltix / voltix)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: voltix-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'volatile-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then exits. The API and worker wait for it.
  migrate:
    image: voltix-api-tools:local
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://voltix:voltix@postgres:5432/voltix
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    profiles: [app, seed]

  api:
    <<: *app
    container_name: voltix-api
    command: ['node', 'dist/main.js']
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # readiness: 200 only while the database answers (Redis is informational)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    container_name: voltix-worker
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Dev convenience, run by hand: docker compose --profile seed run --rm seed
  seed:
    image: voltix-api-tools:local
    command: ['pnpm', 'exec', 'tsx', 'prisma/seed.ts']
    env_file: .env
    environment:
      NODE_ENV: development # the seed refuses the default password when NODE_ENV=production
      DATABASE_URL: postgresql://voltix:voltix@postgres:5432/voltix
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [seed, app]

volumes:
  postgres_data:
  rabbitmq_data:
