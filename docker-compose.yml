services:
  postgres:
    image: postgres:17-alpine
    container_name: voltix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltix
      POSTGRES_PASSWORD: voltix
      POSTGRES_DB: voltix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltix -d voltix']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
