services:
  postgres:
    image: postgres:17-alpine
    container_name: voltix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltix
      POSTGRES_PASSWORD: voltix
      POSTGRES_DB: voltix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltix -d voltix']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: voltix-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: voltix
      RABBITMQ_DEFAULT_PASS: voltix
    ports:
      - '5672:5672'
      - '15672:15672' # management UI: http://localhost:15672 (voltix / voltix)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
